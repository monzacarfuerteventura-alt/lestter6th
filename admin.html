<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel Volcano Cars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800;125,800&family=Audiowide&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F2F0EB; --surface:#FFFFFF; --surface-2:#E9E6DF; --line:#DCD8CF;
  --ink:#1C1C1B; --muted:#65625C; --brand:#1C1C1B; --brand-ink:#FFFFFF; --brand-soft:#EFEAE3;
  --accent:#DF4A1B; --accent-ink:#FFFFFF; --ok:#1F8B4C; --ok-soft:#E3F2E9; --bad:#B3261E; --bad-soft:#FBE9E7;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#141413; --surface:#1E1E1D; --surface-2:#282826; --line:#343431;
  --ink:#F3EFE9; --muted:#A49E97; --brand:#F3EFE9; --brand-ink:#15171A; --brand-soft:#1E2125;
  --accent:#F05A26; --accent-ink:#FFFFFF; --ok:#3DBF76; --ok-soft:#14291D; --bad:#F2918A; --bad-soft:#3A1D1B;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px}
h1,h2{font-family:var(--display);font-stretch:112%;font-weight:800;margin:0;line-height:1.1}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:18px;text-decoration:none;color:inherit}
.logo i{font-style:normal;width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.logo span{color:var(--accent)}
@media (max-width:420px){.bar .tag{display:none}}
.bar .tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar .sp{margin-left:auto;display:flex;gap:8px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn:disabled{opacity:.55;cursor:wait}
.b-acc{background:var(--accent);color:var(--accent-ink)}
.b-brand{background:var(--brand);color:var(--brand-ink)}
.b-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.b-bad{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.b-sm{padding:8px 12px;font-size:14px;border-radius:9px}
main{padding-block:24px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.in{min-height:100px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.g3{grid-template-columns:1fr 1fr}}
.msg{padding:12px 14px;border-radius:10px;font-weight:600}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.num{font-variant-numeric:tabular-nums}

/* login */
.login{max-width:400px;margin:10vh auto 0;display:grid;gap:16px}

/* list */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface-2)}
.pill.disponible{background:var(--ok-soft);color:var(--ok)}
.pill.reservado{background:#FDEBD3;color:#8A4B00}
.pill.vendido{background:var(--surface-2);color:var(--muted)}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.row .th{width:96px;aspect-ratio:4/3;border-radius:9px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px}
.row .th img{width:100%;height:100%;object-fit:cover}
.row b{display:block;font-size:16px}
.row small{color:var(--muted)}
.row .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row select{padding:8px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:14px}
.row.vendido{opacity:.6}
@media (max-width:600px){.row{grid-template-columns:80px 1fr}.row .th{width:80px}.row .acts{grid-column:1/-1;justify-content:flex-start}}
.empty{text-align:center;padding:40px 16px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}

/* form */
form.car{display:grid;gap:18px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
legend{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:18px;margin-bottom:10px;padding:0}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;display:grid;gap:6px;justify-items:center;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop b{font-size:16px}
.drop small{color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .main{position:absolute;top:6px;left:6px;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-ink);padding:3px 7px;border-radius:999px}
.ph .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;gap:4px;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.ph .ctl button{width:34px;height:34px;border-radius:8px;border:0;background:rgba(255,255,255,.92);color:#122029;font-size:16px;font-weight:700;cursor:pointer}
.ph .ctl button.del{background:#fff;color:#B3261E}
.ph.up{display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:600}
.ph.up::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:var(--p,10%);background:var(--brand);transition:width .2s}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.foot{position:sticky;bottom:0;background:var(--ground);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0));display:flex;gap:10px;border-top:1px solid var(--line)}
.foot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="/" target="_blank" rel="noopener" aria-label="Volcano Cars" style="display:inline-flex;align-items:center;gap:8px;color:var(--ink)"><svg viewBox="0 0 640 100" width="130" aria-hidden="true" style="display:block;fill:currentColor"><path d="M0 0H26L40 66 54 0H80L56 100H24Z"/><path fill-rule="evenodd" d="M106 0H158Q172 0 172 14V86Q172 100 158 100H106Q92 100 92 86V14Q92 0 106 0ZM118 24V76H146V24Z"/><path d="M184 0H210V76H258V100H184Z"/><path d="M350 0H284Q270 0 270 14V86Q270 100 284 100H350V76H296V24H350Z"/><path fill-rule="evenodd" d="M362 100V14Q362 0 376 0H428Q442 0 442 14V100H416V66H388V100ZM388 24V44H416V24Z"/><path d="M454 100V0H480L508 52V0H534V100H508L480 48V100Z"/><path d="M536 100L560 0H580L588 11 596 0H616L640 100Z"/><path d="M563 44H603L614 88H552Z" fill="#DF4A1B"/></svg></a>
    <span class="tag">Panel</span>
    <div class="sp" id="topacts" hidden>
      <a class="btn b-ghost b-sm" href="/#comprar" target="_blank" rel="noopener">Ver web</a>
      <button class="btn b-ghost b-sm" id="logout" type="button">Salir</button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- LOGIN -->
  <section id="s-login" hidden>
    <form class="card login" id="login-form">
      <h1 style="font-size:26px">Entrar al panel</h1>
      <p style="margin:0;color:var(--muted)">Desde aquí publicas, editas y marcas como vendidos los coches de la web.</p>
      <div class="field"><label for="pw">Contraseña</label><input class="in" id="pw" type="password" autocomplete="current-password" required></div>
      <div class="msg bad" id="login-err" hidden></div>
      <button class="btn b-brand" type="submit" id="login-btn">Entrar</button>
    </form>
  </section>

  <!-- LISTA -->
  <section id="s-list" hidden>
    <div class="head">
      <div><h1 style="font-size:28px">Tus coches</h1><p>Lo que publiques aquí aparece al momento en la web.</p></div>
      <button class="btn b-acc" id="add" type="button">+ Añadir coche</button>
    </div>
    <div class="stats num" id="stats"></div>
    <div class="list" id="list"></div>
  </section>

  <!-- FORMULARIO -->
  <section id="s-form" hidden>
    <div class="head">
      <div><h1 style="font-size:28px" id="f-title">Añadir coche</h1><p>Los campos con * son obligatorios.</p></div>
      <button class="btn b-ghost b-sm" type="button" data-back>← Volver</button>
    </div>
    <form class="car" id="car-form" novalidate>
      <fieldset class="card">
        <legend>Fotos</legend>
        <label class="drop" id="drop" for="files">
          <b>Añadir fotos</b>
          <small>Desde la galería o la cámara. La primera es la foto principal.</small>
        </label>
        <input id="files" type="file" accept="image/*" multiple hidden>
        <div class="photos" id="photos"></div>
      </fieldset>

      <fieldset class="card">
        <legend>El coche</legend>
        <div class="g2">
          <div class="field"><label for="marca">Marca *</label><input class="in" id="marca" list="marcas" required placeholder="Ej. Toyota"></div>
          <div class="field"><label for="modelo">Modelo *</label><input class="in" id="modelo" required placeholder="Ej. Corolla"></div>
        </div>
        <div class="field"><label for="version">Versión</label><input class="in" id="version" placeholder="Ej. 125H Active Tech"></div>
        <div class="g3">
          <div class="field"><label for="anio">Año *</label><input class="in num" id="anio" inputmode="numeric" required placeholder="2020"></div>
          <div class="field"><label for="km">Kilómetros *</label><input class="in num" id="km" inputmode="numeric" required placeholder="45000"></div>
          <div class="field"><label for="precio">Precio al contado (€) *</label><input class="in num" id="precio" inputmode="decimal" required placeholder="2999,99"></div>
        </div>
        <div class="g3">
          <div class="field"><label for="combustible">Combustible</label><select class="in" id="combustible"><option>Gasolina</option><option>Diésel</option><option>Híbrido</option><option>Híbrido enchufable</option><option>Eléctrico</option><option>GLP</option></select></div>
          <div class="field"><label for="cambio">Cambio</label><select class="in" id="cambio"><option>Manual</option><option>Automático</option></select></div>
          <div class="field"><label for="etiqueta">Etiqueta DGT</label><select class="in" id="etiqueta"><option value="">Sin etiqueta</option><option>0</option><option>ECO</option><option>C</option><option>B</option></select></div>
        </div>
        <div class="g3">
          <div class="field"><label for="cv">Potencia (CV)</label><input class="in num" id="cv" inputmode="numeric" placeholder="122"></div>
          <div class="field"><label for="puertas">Puertas</label><select class="in" id="puertas"><option value="">—</option><option>3</option><option selected>5</option><option>2</option><option>4</option></select></div>
          <div class="field"><label for="color">Color</label><input class="in" id="color" placeholder="Blanco"></div>
        </div>
      </fieldset>

      <fieldset class="card">
        <legend>Descripción</legend>
        <div class="field"><label for="descripcion">Cuéntale al cliente cómo está el coche</label><textarea class="in" id="descripcion" placeholder="Un solo propietario, libro de mantenimiento al día, ITV pasada…"></textarea></div>
        <div class="field"><label for="equipamiento">Equipamiento (uno por línea)</label><textarea class="in" id="equipamiento" placeholder="Navegador&#10;Cámara trasera&#10;Climatizador bizona"></textarea></div>
      </fieldset>

      <fieldset class="card">
        <legend>Publicación</legend>
        <div class="field"><label for="estado">Estado</label><select class="in" id="estado"><option value="disponible">Disponible (se ve en la web)</option><option value="reservado">Reservado (se ve con la etiqueta Reservado)</option><option value="vendido">Vendido (sale 60 días en «Vendidos recientemente»)</option></select></div>
        <label class="check"><input type="checkbox" id="destacado"> Destacar en la portada</label>
      </fieldset>

      <div class="msg bad" id="form-err" hidden></div>
      <div class="foot">
        <button class="btn b-bad" type="button" id="del" hidden>Eliminar</button>
        <button class="btn b-acc" type="submit" id="save">Publicar coche</button>
      </div>
    </form>
  </section>
</main>

<datalist id="marcas">
  <option>Audi</option><option>BMW</option><option>Citroën</option><option>Cupra</option><option>Dacia</option><option>Fiat</option><option>Ford</option><option>Honda</option><option>Hyundai</option><option>Jeep</option><option>Kia</option><option>Land Rover</option><option>Mazda</option><option>Mercedes-Benz</option><option>MG</option><option>Mini</option><option>Mitsubishi</option><option>Nissan</option><option>Opel</option><option>Peugeot</option><option>Renault</option><option>Seat</option><option>Skoda</option><option>Suzuki</option><option>Tesla</option><option>Toyota</option><option>Volkswagen</option><option>Volvo</option>
</datalist>

<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => { const v=Math.round(Number(n||0)*100)/100, e=Math.trunc(v), c=Math.round((v-e)*100); return String(e).replace(/\B(?=(\d{3})+(?!\d))/g,".")+(c?","+String(c).padStart(2,"0"):"")+" €"; };
const FOTO = k => "/api/fotos/" + encodeURIComponent(k);
let PW = "";
try { PW = sessionStorage.getItem("mz_pw") || ""; } catch(_){}
let CARS = [], editing = null, fotos = [], uploading = 0, INTERES = {};

function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
function show(id){ ["s-login","s-list","s-form"].forEach(x=>$("#"+x).hidden = x!==id); $("#topacts").hidden = id==="s-login"; window.scrollTo(0,0); }

async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{...(opts.headers||{}), authorization:"Bearer "+PW}});
  if(r.status===401){ logout(); throw new Error("La sesión ha caducado. Vuelve a entrar."); }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || "Algo ha fallado ("+r.status+"). Inténtalo de nuevo.");
  return data;
}

/* ---------- login ---------- */
$("#login-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("#login-btn"); btn.disabled=true; $("#login-err").hidden=true;
  try{
    const r = await fetch("/api/login",{method:"POST",headers:{authorization:"Bearer "+$("#pw").value}});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || "No se ha podido entrar.");
    PW = $("#pw").value; try{ sessionStorage.setItem("mz_pw",PW); }catch(_){}
    $("#pw").value=""; await loadList();
  }catch(err){ $("#login-err").textContent=err.message; $("#login-err").hidden=false; }
  btn.disabled=false;
});
function logout(){ PW=""; try{ sessionStorage.removeItem("mz_pw"); }catch(_){}; show("s-login"); }
$("#logout").onclick=logout;

/* ---------- lista ---------- */
async function loadList(){
  show("s-list");
  $("#list").innerHTML='<div class="empty">Cargando…</div>';
  fetch("/api/interes",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(m=>{ INTERES=m||{}; if(CARS.length) renderList(); }).catch(()=>{});
  try{ CARS = await api("/api/coches?todos=1"); renderList(); }
  catch(err){ $("#list").innerHTML=`<div class="empty">${esc(err.message)}</div>`; }
}
function renderList(){
  const n = k => CARS.filter(c=>c.estado===k).length;
  $("#stats").innerHTML = `<span class="pill disponible">${n("disponible")} disponibles</span><span class="pill reservado">${n("reservado")} reservados</span><span class="pill vendido">${n("vendido")} vendidos</span>`;
  if(!CARS.length){ $("#list").innerHTML='<div class="empty"><b style="color:var(--ink)">Todavía no hay coches.</b><br>Pulsa «Añadir coche» para publicar el primero.</div>'; return; }
  $("#list").innerHTML = CARS.map(c=>`
    <div class="row ${c.estado}">
      <div class="th">${c.fotos[0]?`<img src="${FOTO(c.fotos[0])}" alt="" loading="lazy">`:"Sin foto"}</div>
      <div><b>${esc(c.marca)} ${esc(c.modelo)} ${c.destacado?'<span class="pill" style="font-size:11px;padding:2px 7px;vertical-align:2px">Destacado</span>':""}</b>
        <small class="num">${esc(c.version||"")}${c.version?" · ":""}${c.anio} · ${Number(c.km).toLocaleString("es-ES")} km · <b style="display:inline;color:var(--ink)">${eur(c.precio)}</b>${INTERES[c.id]?` · <b style="display:inline;color:var(--accent)">${INTERES[c.id]} interesado${INTERES[c.id]>1?"s":""} esta semana</b>`:""}</small></div>
      <div class="acts">
        <select data-estado="${esc(c.id)}" aria-label="Estado de ${esc(c.marca+" "+c.modelo)}">
          ${["disponible","reservado","vendido"].map(s=>`<option value="${s}" ${s===c.estado?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}
        </select>
        <button class="btn b-brand b-sm" type="button" data-edit="${esc(c.id)}">Editar</button>
      </div>
    </div>`).join("");
}
$("#list").addEventListener("change", async e=>{
  const id=e.target.dataset.estado; if(!id) return;
  const c=CARS.find(x=>x.id===id); const prev=c.estado; c.estado=e.target.value;
  try{ Object.assign(c, await api("/api/coches/"+id,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(c)})); renderList(); toast("Marcado como "+c.estado); }
  catch(err){ c.estado=prev; renderList(); toast(err.message); }
});
$("#list").addEventListener("click", e=>{ const id=e.target.dataset.edit; if(id) openForm(CARS.find(x=>x.id===id)); });
$("#add").onclick=()=>openForm(null);
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{ if(uploading && !confirm("Hay fotos subiéndose. ¿Salir igualmente?")) return; show("s-list"); });

/* ---------- formulario ---------- */
const F = ["marca","modelo","version","anio","km","precio","combustible","cambio","etiqueta","cv","puertas","color","descripcion","estado"];
function openForm(c){
  editing = c; fotos = c ? [...c.fotos] : [];
  $("#car-form").reset();
  F.forEach(k=>{ if(c && c[k]!=null) $("#"+k).value = c[k]; });
  $("#equipamiento").value = c ? (c.equipamiento||[]).join("\n") : "";
  $("#destacado").checked = !!(c && c.destacado);
  if(!c){ $("#estado").value="disponible"; $("#puertas").value="5"; }
  $("#f-title").textContent = c ? `Editar ${c.marca} ${c.modelo}` : "Añadir coche";
  $("#save").textContent = c ? "Guardar cambios" : "Publicar coche";
  $("#del").hidden = !c; $("#form-err").hidden = true;
  renderPhotos(); show("s-form");
}
function renderPhotos(){
  const done = fotos.map((k,i)=>`
    <div class="ph">${i===0?'<span class="main">Principal</span>':""}<img src="${FOTO(k)}" alt="Foto ${i+1}">
      <div class="ctl">
        <button type="button" data-mv="${i}" data-d="-1" aria-label="Mover a la izquierda" ${i===0?"disabled":""}>‹</button>
        ${i>0?`<button type="button" data-main="${i}" aria-label="Poner como principal">★</button>`:""}
        <button type="button" data-mv="${i}" data-d="1" aria-label="Mover a la derecha" ${i===fotos.length-1?"disabled":""}>›</button>
        <button type="button" class="del" data-rm="${i}" aria-label="Quitar foto">✕</button>
      </div></div>`).join("");
  const pend = [...Array(uploading)].map(()=>'<div class="ph up">Subiendo…</div>').join("");
  $("#photos").innerHTML = done + pend;
}
$("#photos").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.rm){ fotos.splice(+b.dataset.rm,1); }
  if(b.dataset.main){ const [f]=fotos.splice(+b.dataset.main,1); fotos.unshift(f); }
  if(b.dataset.mv){ const i=+b.dataset.mv, j=i+(+b.dataset.d); [fotos[i],fotos[j]]=[fotos[j],fotos[i]]; }
  renderPhotos();
});

// Reduce la foto antes de subirla (máx. 1600 px, JPEG): sube rápido con datos móviles.
async function shrink(file){
  let img;
  try{ img = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(_){ img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ko(new Error("No se ha podido leer "+file.name)); i.src=URL.createObjectURL(file); }); }
  const max=1600, w=img.width, h=img.height, s=Math.min(1, max/Math.max(w,h));
  const cv=document.createElement("canvas"); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return await new Promise(ok=>cv.toBlob(ok,"image/jpeg",0.82));
}
async function addFiles(list){
  const files=[...list].filter(f=>f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
  if(!files.length) return;
  uploading += files.length; renderPhotos();
  for(const f of files){
    try{
      const blob = await shrink(f);
      const r = await api("/api/fotos",{method:"POST",headers:{"content-type":"image/jpeg"},body:blob});
      fotos.push(r.key);
    }catch(err){ toast(err.message || ("No se ha podido subir "+f.name)); }
    uploading--; renderPhotos();
  }
}
$("#files").addEventListener("change", e=>{ addFiles(e.target.files); e.target.value=""; });
const drop=$("#drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop", e=>addFiles(e.dataTransfer.files));

$("#car-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const err=$("#form-err"); err.hidden=true;
  if(uploading){ err.textContent="Espera a que terminen de subir las fotos."; err.hidden=false; return; }
  const miss = ["marca","modelo","anio","km","precio"].filter(k=>!$("#"+k).value.trim());
  if(miss.length){ err.textContent="Rellena: "+miss.map(k=>$(`label[for=${k}]`).textContent.replace(" *","")).join(", ")+"."; err.hidden=false; $("#"+miss[0]).focus(); return; }
  const data = Object.fromEntries(F.map(k=>[k,$("#"+k).value]));
  data.equipamiento = $("#equipamiento").value; data.destacado=$("#destacado").checked; data.fotos=fotos;
  const btn=$("#save"); btn.disabled=true;
  try{
    if(editing) await api("/api/coches/"+editing.id,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(data)});
    else await api("/api/coches",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(data)});
    toast(editing ? "Cambios guardados" : "Coche publicado en la web");
    await loadList();
  }catch(e2){ err.textContent=e2.message; err.hidden=false; }
  btn.disabled=false;
});
$("#del").onclick = async ()=>{
  if(!editing || !confirm(`¿Eliminar el ${editing.marca} ${editing.modelo} y sus fotos? No se puede deshacer.\n\nSi lo has vendido, mejor márcalo como «Vendido».`)) return;
  try{ await api("/api/coches/"+editing.id,{method:"DELETE"}); toast("Coche eliminado"); await loadList(); }
  catch(err){ toast(err.message); }
};

if(PW){ fetch("/api/login",{method:"POST",headers:{authorization:"Bearer "+PW}}).then(r=>r.ok?loadList():logout()).catch(()=>show("s-login")); }
else show("s-login");
